name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    name: Check code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux graphics and audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libgl1-mesa-dev libxkbcommon-dev libasound2-dev
      - name: Check documentation contracts
        run: sh scripts/check-docs.sh
      - name: Verify formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            archive: OziClock-${{ github.ref_name }}-windows-x64.zip
            binary: oziclock-desktop.exe
          - name: Linux x64
            os: ubuntu-latest
            archive: OziClock-${{ github.ref_name }}-linux-x64.tar.gz
            binary: oziclock-desktop
          - name: macOS Apple Silicon
            os: macos-latest
            archive: OziClock-${{ github.ref_name }}-macos-arm64.tar.gz
            binary: oziclock-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux graphics and audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libgl1-mesa-dev libxkbcommon-dev libasound2-dev
      - name: Build release application
        run: cargo build --release -p oziclock-desktop
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item ui/fonts/OFL.txt target/release/Carlito-OFL.txt
          Compress-Archive -Path target/release/${{ matrix.binary }},target/release/Carlito-OFL.txt -DestinationPath ${{ matrix.archive }}
      - name: Package Unix executable
        if: runner.os == 'Linux'
        run: |
          mkdir package
          cp target/release/${{ matrix.binary }} package/${{ matrix.binary }}
          cp ui/fonts/OFL.txt package/Carlito-OFL.txt
          tar -czf ${{ matrix.archive }} -C package .
      - name: Package macOS application bundle
        if: runner.os == 'macOS'
        run: |
          app_name=OziClock.app
          mkdir -p "$app_name/Contents/MacOS" "$app_name/Contents/Resources"
          cp target/release/${{ matrix.binary }} "$app_name/Contents/MacOS/${{ matrix.binary }}"
          cp apps/oziclock-desktop/macos/Info.plist "$app_name/Contents/Info.plist"
          cp apps/oziclock-desktop/macos/OziClock.icns "$app_name/Contents/Resources/OziClock.icns"
          cp ui/fonts/OFL.txt "$app_name/Contents/Resources/Carlito-OFL.txt"
          release_version="${GITHUB_REF_NAME#v}"
          short_version="${release_version%%-*}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $short_version" "$app_name/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$app_name/Contents/Info.plist"
          codesign --force --deep --sign - "$app_name"
          codesign --verify --deep --strict --verbose=2 "$app_name"
          tar -czf ${{ matrix.archive }} "$app_name"
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [quality, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: OziClock ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## OziClock ${{ github.ref_name }}

            This is a beta build for testing the new local-first Planner before the next stable release.

            ### Highlights

            - Local alarms with Once and Weekly schedules, missed/delivered status, Snooze and durable attention cards.
            - Named countdown timers with pause, restart, reset, repeat and recovery after restart.
            - Stopwatch with hundredths, laps, split analysis, undo and clear controls.
            - Tasks and dated or recurring reminders with modal editors and local attention cards.
            - Weekly Plan view with reminder markers and quick creation from a time cell.
            - Cross-platform release archives for Windows x64, Linux x64, and macOS Apple Silicon.

            Please report beta issues with the operating system, exact steps, and a screenshot when possible.

            ### Packaging

            - Windows archive contains one self-contained executable with the Visual C++ runtime linked statically.
            - macOS archive contains `OziClock.app`, which opens directly from Finder without Terminal.
            - Carlito is embedded for consistent text metrics on Windows, macOS, and Linux.

            `settings.json` is created beside the executable on Windows and Linux, or under `~/Library/Application Support/OziClock` on macOS. The Windows release is x64; macOS release is Apple Silicon.
          files: release-assets/*
