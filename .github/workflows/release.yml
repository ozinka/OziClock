name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            archive: OziClock-${{ github.ref_name }}-windows-x64.zip
            binary: oziclock-desktop.exe
          - name: Linux x64
            os: ubuntu-latest
            archive: OziClock-${{ github.ref_name }}-linux-x64.tar.gz
            binary: oziclock-desktop
          - name: macOS Apple Silicon
            os: macos-latest
            archive: OziClock-${{ github.ref_name }}-macos-arm64.tar.gz
            binary: oziclock-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libgl1-mesa-dev libxkbcommon-dev
      - name: Verify formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release application
        run: cargo build --release -p oziclock-desktop
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item ui/fonts/OFL.txt target/release/Carlito-OFL.txt
          Compress-Archive -Path target/release/${{ matrix.binary }},target/release/Carlito-OFL.txt -DestinationPath ${{ matrix.archive }}
      - name: Package Unix executable
        if: runner.os == 'Linux'
        run: |
          mkdir package
          cp target/release/${{ matrix.binary }} package/${{ matrix.binary }}
          cp ui/fonts/OFL.txt package/Carlito-OFL.txt
          tar -czf ${{ matrix.archive }} -C package .
      - name: Package macOS application bundle
        if: runner.os == 'macOS'
        run: |
          app_name=OziClock.app
          mkdir -p "$app_name/Contents/MacOS" "$app_name/Contents/Resources"
          cp target/release/${{ matrix.binary }} "$app_name/Contents/MacOS/${{ matrix.binary }}"
          cp apps/oziclock-desktop/macos/Info.plist "$app_name/Contents/Info.plist"
          cp ui/fonts/OFL.txt "$app_name/Contents/Resources/Carlito-OFL.txt"
          version="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app_name/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" "$app_name/Contents/Info.plist"
          tar -czf ${{ matrix.archive }} "$app_name"
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            ## OziClock ${{ github.ref_name }}

            A native Rust and Slint release of OziClock.

            ### Highlights

            - Cross-platform release archives for Windows, Linux, and macOS.
            - Configurable multi-time-zone clock strip with portable JSON settings.
            - Compact mode, rulers, interactive time exploration, tray menu, and redesigned settings.
            - Windows archive contains one self-contained executable with the Visual C++ runtime linked statically.
            - macOS archive contains `OziClock.app`, which opens directly from Finder without Terminal.
            - Carlito is embedded for consistent text metrics on Windows, macOS, and Linux.
            - Rulers and time slider move synchronously with the clock strip on macOS.

            `settings.json` is created beside the executable on Windows and Linux, or beside `OziClock.app` on macOS. The Windows release is x64; macOS release is Apple Silicon.
          files: release-assets/*
