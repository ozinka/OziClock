<!doctype html>
<html lang="en" data-style="slate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OziClock Calendar — visual study</title>
  <style>
    :root { --canvas:#edf0ed; --panel:#fff; --header:#f8f9f7; --line:#d9dedb; --text:#18302f; --muted:#687572; --quiet:#93a09d; --accent:#587b74; --accent-hover:#476963; --accent-ink:#fff; --weekend:#b55058; --button:#f2f4f2; --button-hover:#e7ece9; --shadow:0 18px 45px rgb(30 49 46 / 14%),0 2px 6px rgb(30 49 46 / 8%); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    :root[data-style="blue"] { --canvas:#edf2f5; --header:#f8fafb; --line:#d7dfe4; --text:#193243; --muted:#657582; --quiet:#96a4ae; --accent:#3d6d89; --accent-hover:#315c76; --weekend:#b34f5d; --button:#f0f4f6; --button-hover:#e5edf1; --shadow:0 18px 45px rgb(27 60 80 / 14%),0 2px 6px rgb(27 60 80 / 8%); }
    :root[data-style="warm"] { --canvas:#f2f0eb; --header:#fbfaf7; --line:#e1ddd4; --text:#342e29; --muted:#776e63; --quiet:#a39a8d; --accent:#82694d; --accent-hover:#69533d; --weekend:#ae4c50; --button:#f5f2ec; --button-hover:#ede8df; --shadow:0 18px 45px rgb(72 56 37 / 13%),0 2px 6px rgb(72 56 37 / 8%); }
    * { box-sizing:border-box; } body { min-height:100vh; margin:0; display:grid; place-items:center; padding:32px 18px; color:var(--text); background:var(--canvas); } button,select { font:inherit; } button { cursor:pointer; }
    .study { width:min(100%,650px); } .calendar { overflow:hidden; border:1px solid var(--line); border-radius:15px; background:var(--panel); box-shadow:var(--shadow); }
    .calendar-header { display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:84px; padding:17px 18px 15px; background:var(--header); border-bottom:1px solid var(--line); } .eyebrow { margin-bottom:5px; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; } h1 { margin:0; color:var(--text); font-size:21px; font-weight:650; letter-spacing:-.025em; }
    .header-actions,.view-switch,.design-controls { display:flex; align-items:center; gap:7px; } .icon-button,.text-button,.view-button,select { min-height:34px; border:1px solid var(--line); border-radius:7px; color:var(--text); background:var(--button); transition:background 150ms ease,border-color 150ms ease,color 150ms ease; } .icon-button:hover,.text-button:hover,.view-button:hover,select:hover { background:var(--button-hover); } .icon-button { width:34px; padding:0; font-size:18px; line-height:1; } .text-button,.view-button { padding:0 12px; font-size:12px; font-weight:560; } .text-button { min-width:66px; }
    .calendar-body { padding:14px 18px 16px; } .view-switch { margin-bottom:12px; } .view-button { min-width:61px; } .view-button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent-ink); background:var(--accent); }
    .month-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; } .weekday { padding:4px 2px 7px; color:var(--muted); font-size:10px; font-weight:650; text-align:center; } .weekday.weekend { color:var(--weekend); } .day { min-height:39px; border:0; border-radius:7px; color:var(--text); background:transparent; font-size:14px; font-variant-numeric:tabular-nums; } .day:hover { background:var(--button-hover); } .day.outside { color:var(--quiet); } .day.weekend:not(.selected) { color:var(--weekend); } .day.today:not(.selected) { box-shadow:inset 0 0 0 1px var(--accent); } .day.selected { color:var(--accent-ink); background:var(--accent); font-weight:700; }
    .footer { display:flex; justify-content:space-between; gap:14px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; } .footer strong { color:var(--text); font-weight:620; text-align:right; } .design-controls { justify-content:center; margin:16px auto 0; color:var(--muted); font-size:12px; } .design-controls select { padding:0 9px; } .design-note { margin:11px auto 0; color:var(--muted); font-size:12px; line-height:1.45; text-align:center; }
    @media (max-width:480px) { body { padding:16px 10px; } .calendar-header { align-items:flex-start; min-height:106px; padding:15px; } .header-actions { padding-top:2px; } .calendar-body { padding:13px 12px 14px; } .day { min-height:36px; } .text-button { min-width:0; padding-inline:9px; } .footer { align-items:flex-start; flex-direction:column; gap:4px; } .footer strong { text-align:left; } }
  </style>
</head>
<body>
  <main class="study">
    <section class="calendar" aria-labelledby="calendar-heading">
      <header class="calendar-header"><div><div class="eyebrow">Calendar</div><h1 id="calendar-heading">September 2026</h1></div><div class="header-actions"><button class="icon-button" id="previous" aria-label="Previous month">‹</button><button class="text-button" id="today">Today</button><button class="icon-button" id="next" aria-label="Next month">›</button></div></header>
      <div class="calendar-body"><nav class="view-switch" aria-label="Calendar view"><button class="view-button" aria-pressed="false">Week</button><button class="view-button" aria-pressed="true">Month</button><button class="view-button" aria-pressed="false">Year</button></nav><div class="month-grid" id="calendar-grid"></div><footer class="footer"><span>Selected date</span><strong id="selected-date">Wednesday, 2 September 2026</strong></footer></div>
    </section>
    <div class="design-controls"><label for="style">Visual direction</label><select id="style"><option value="slate">Slate green — recommended</option><option value="blue">Quiet blue</option><option value="warm">Warm graphite</option></select></div>
    <p class="design-note">No gradients: the hierarchy now comes from spacing, a restrained surface contrast, and one accent reserved for selection.</p>
  </main>
  <script>
    const state={cursor:new Date(2026,8,1),selected:new Date(2026,8,2)};const grid=document.getElementById("calendar-grid"),heading=document.getElementById("calendar-heading"),selectedDate=document.getElementById("selected-date"),monthFormat=new Intl.DateTimeFormat("en",{month:"long",year:"numeric"}),dateFormat=new Intl.DateTimeFormat("en",{weekday:"long",day:"numeric",month:"long",year:"numeric"}),weekdayFormat=new Intl.DateTimeFormat("en",{weekday:"short"}),sameDate=(a,b)=>a.toDateString()===b.toDateString();
    function renderCalendar(){const year=state.cursor.getFullYear(),month=state.cursor.getMonth(),first=new Date(year,month,1),offset=(first.getDay()+6)%7,start=new Date(year,month,1-offset);heading.textContent=monthFormat.format(first);const headers=Array.from({length:7},(_,index)=>`<div class="weekday ${index>4?"weekend":""}">${weekdayFormat.format(new Date(2026,7,31+index))}</div>`).join("");const dates=Array.from({length:42},(_,index)=>{const date=new Date(start);date.setDate(start.getDate()+index);const classes=["day"];if(date.getMonth()!==month)classes.push("outside");if(date.getDay()===0||date.getDay()===6)classes.push("weekend");if(sameDate(date,new Date()))classes.push("today");if(sameDate(date,state.selected))classes.push("selected");return `<button class="${classes.join(" ")}" data-date="${date.toISOString()}" aria-label="${dateFormat.format(date)}">${date.getDate()}</button>`;}).join("");grid.innerHTML=headers+dates;grid.querySelectorAll("[data-date]").forEach(button=>button.addEventListener("click",()=>{state.selected=new Date(button.dataset.date);selectedDate.textContent=dateFormat.format(state.selected);renderCalendar();}));}
    document.getElementById("previous").addEventListener("click",()=>{state.cursor.setMonth(state.cursor.getMonth()-1);renderCalendar();});document.getElementById("next").addEventListener("click",()=>{state.cursor.setMonth(state.cursor.getMonth()+1);renderCalendar();});document.getElementById("today").addEventListener("click",()=>{state.cursor=new Date();state.selected=new Date();selectedDate.textContent=dateFormat.format(state.selected);renderCalendar();});document.querySelectorAll(".view-button").forEach(button=>button.addEventListener("click",()=>document.querySelectorAll(".view-button").forEach(item=>item.setAttribute("aria-pressed",String(item===button)))));document.getElementById("style").addEventListener("change",event=>{document.documentElement.dataset.style=event.target.value;});renderCalendar();
  </script>
</body>
</html>
