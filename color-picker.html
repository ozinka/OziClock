<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вибір кольору</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #4f46e5;
      transition: background-color 180ms ease;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid rgb(255 255 255 / 35%);
      border-radius: 16px;
      background: rgb(0 0 0 / 45%);
      box-shadow: 0 12px 32px rgb(0 0 0 / 25%);
      backdrop-filter: blur(12px);
    }

    input[type="color"] {
      width: 52px;
      height: 44px;
      padding: 3px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    output {
      min-width: 78px;
      color: white;
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="controls" aria-label="Вибір кольору фону">
    <label for="color" hidden>Колір фону</label>
    <input id="color" type="color" value="#4f46e5" aria-label="Колір фону">
    <output id="value" for="color">#4F46E5</output>
  </main>

  <script>
    const colorPicker = document.querySelector("#color");
    const colorValue = document.querySelector("#value");

    colorPicker.addEventListener("input", () => {
      document.body.style.backgroundColor = colorPicker.value;
      colorValue.value = colorPicker.value.toUpperCase();
    });
  </script>
</body>
</html>
